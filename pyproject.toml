[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kaye-engine"
# FIXME patch bump, yet [Unreleased] adds public API & breaks marketplace name
version = "12.0.1-alpha"
description = "A Markdown-to-prompt engine: parse any number of plain Markdown sources into one structured tree, select the parts a scenario needs through blueprints, and render them as prompts, Agent Skills, and plugins for the tools you use, so your instructions keep a single source of truth and never drift apart"
readme = "README.md"
authors = [
    { name = "kamiLeL", email = "77594253+kami-lel@users.noreply.github.com" },
]
requires-python = ">=3.11"
# FIXME anytree, json5, pyahocorasick, pyyaml unpinned: no lower/upper bound
dependencies = [
    "anytree",
    "json5",
    "kamilog @ git+https://github.com/kami-lel/kamilog.git@v3.0.1",
    "pyahocorasick",
    "pyyaml",
]

[project.urls]
homepage = "https://github.com/kami-lel/kaye-engine/blob/main/README.md"
Repository = "https://github.com/kami-lel/kaye-engine"

[project.scripts]
kaye-engine = "kaye_engine.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
include-package-data = false
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["kaye_engine*"]
exclude = ["build*", "tests*", "dify_studio*", "examples*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["permission_cmds.jsonc"]
"kaye_engine.cli.github_release" = ["installer_templates/*"]

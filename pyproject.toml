[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kaye-engine"
version = "7.4.0"
description = "parse a plain Markdown file, as the structured single source of truth for LLM instructions, then render scenario-ready prompt assets"
readme = "README.md"
authors = [
    { name = "kamiLeL", email = "77594253+kami-lel@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "anytree",
    "json5",
    "pyahocorasick",
    "pyyaml",
]

[project.urls]
homepage = "https://github.com/kami-lel/kaye-engine/blob/main/README.md"
Repository = "https://github.com/kami-lel/kaye-engine"

[project.scripts]
kaye-engine = "kaye_engine.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
include-package-data = false
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["kaye_engine*"]
exclude = ["build*", "tests*", "dify_studio*", "examples*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["permission_cmds.jsonc"]

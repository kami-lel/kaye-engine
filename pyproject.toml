[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "kaye-engine"
version = "6.11.0"
description = "define Kaye, a composed and exacting AI assistant persona, in a single source of truth and reuse it consistently across every task and tool"
readme = "README.md"
authors = [
    { name = "kamiLeL", email = "77594253+kami-lel@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
    "anytree",
    "flask",
    "json5",
    "pyahocorasick",
    "pyyaml",
]

[project.urls]
homepage = "https://github.com/kami-lel/kaye-engine/blob/main/README.md"
Repository = "https://github.com/kami-lel/kaye-engine"

[project.scripts]
kaye-engine = "kaye_engine.__main__:main"

[project.optional-dependencies]
dev = [
    "pydantic",
    "pytest",
]

[tool.setuptools]
include-package-data = false
package-dir = { "" = "." }

[tool.setuptools.packages.find]
where = ["."]
include = ["kaye_engine*"]
exclude = ["build*", "tests*", "dify_studio*", "examples*", "scripts*"]

[tool.setuptools.package-data]
"*" = ["abbrs.json", "permission_cmds.jsonc"]

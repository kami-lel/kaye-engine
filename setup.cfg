[metadata]
name = Kaye
version = 4.12.1
description = Prompt Engineering Project Kaye
long_description = file: README.md
author = kamiLeL

[options]
include_package_data = True
packages = find:
package_dir =
    = .

python_requires = >=3.11
install_requires =
    anytree
    flask

[options.package_data]
* =
    prompt_corpus.md
    gen_prompt/prompt_blueprints/*
    *.prompt_blueprints

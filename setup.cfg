[metadata]
name = Kaye
version = 6.2.2-alpha
description = Prompt Engineering Project Kaye
long_description = file: README.md
author = kamiLeL

[options]
include_package_data = True
packages = find:
package_dir =
    = .

python_requires = >=3.11
install_requires =
    anytree
    flask
    pyahocorasick


[options.package_data]
* =
    prompt_corpus.md
    abbrs.json

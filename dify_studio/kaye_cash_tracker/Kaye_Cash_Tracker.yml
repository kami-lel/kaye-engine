    - data:
        code: "\"\"\"\npost extract node, perform:\n\n- merge extracted transactions\
          \ (``extract_obj``)\n  with existing transactions (``current_transactions``)\n\
          \n- create a MD-formatted table\n\n\n:param current_transactions:\n:type\
          \ current_transactions: dict\n:param extract_obj:\n:type extract_obj: dict\n\
          :return: {\n    \"transactions\": merged transactions, serialized as json\n\
          \    \"transactions_table\": md formatted transaction\n    \"is_pushable\"\
          : whether ``transactions`` is directly pushable\n    \"answer\": full answer\
          \ to be printed for extract branch\n}\n:rtype: dict{\n    \"transactions\"\
          : str\n    \"transactions_table\": str\n    \"is_pushable\": bool\n    \"\
          answer\": str\n}\n\"\"\"\n\nimport json\n\n# output keys  #################################################################\n\
          OUTPUT_TRANSACTIONS_KEY = \"transactions\"\nOUTPUT_TABLE_KEY = \"transactions_table\"\
          \nOUTPUT_PUSHABLE_KEY = \"is_pushable\"\nOUTPUT_ANSWER_KEY = \"answer\"\n\
          \n# constants  ###################################################################\n\
          ROWS_KEY = \"rows\"\n\n\n# Entry Point  #################################################################\n\
          def main(\n    current_transactions: str,\n    extracted_rows: list,\n \
          \   push_trigger: str,\n):  # pylint: disable=missing-function-docstring\n\
          \n    # merge 2 transactions  ====================================================\n\
          \    # merge 2 transactions as a 2D array\n    rows_array = []\n    # add\
          \ current transactions\n    rows_array.extend(json.loads(current_transactions))\n\
          \    # add updated transactions\n    rows_array.extend(extracted_rows)\n\
          \n    rows_dict = {}  # use dict to merge by id/keys\n    for row in rows_array:\n\
          \        tid = row[0]\n        rows_dict[tid] = row\n\n    # convert dict\
          \ to list\n    transactions = sorted(\n        rows_dict.values(),\n   \
          \     key=lambda transaction: transaction[1],  # sort by date\n        reverse=False,\
          \  # newest at bottom\n    )\n\n    # serialize as json string to store\n\
          \    transactions_obj = json.dumps(transactions)\n\n    # create MD table\
          \  =========================================================\n    # generate\
          \ header row with updated headers\n    header = [\"\", \"¤\", \"Out\", \"\
          In\", \"From\", \"To\", \"\", \"Remarks\"]\n    # Separator line for markdown\
          \ table formatting\n    separator = [\"---\"] * 8\n    # Initialize list\
          \ for markdown lines including header\n    md_lines = []\n    md_lines.append(\"\
          | \" + \" | \".join(header) + \" |\")\n    md_lines.append(\"| \" + \" |\
          \ \".join(separator) + \" |\")\n\n    # Fill in data rows from spreadsheet\n\
          \    for row in transactions:\n        # make sure None -> '', and skip\
          \ id field\n        entries = [entry if entry is not None else \"\" for\
          \ entry in row[1:]]\n        line = \"| \" + \" | \".join(entries) + \"\
          \ |\"\n        md_lines.append(line)\n\n    transactions_table = \"\\n\"\
          .join(md_lines)\n\n    # calc is_pushable  ========================================================\n\
          \    is_pushable = \"???\" not in transactions_obj\n\n    # create answer\
          \  ===========================================================\n    if is_pushable:\n\
          \        answer = \"\"\"You may:\n- provide more **new** transactions,\n\
          - make **correction** on existing transactions, or\n- **push** by replying\
          \ `{}`\n\n{}\"\"\".format(push_trigger, transactions_table)\n    else:\n\
          \        answer = \"\"\"Please provide **additional information** for cells\
          \ with `???`\n\nYou also may:\n\n- provide more **new** transactions, or\n\
          - make **correction** on existing transactions\n\n{}\"\"\".format(\n   \
          \         transactions_table\n        )\n\n    # returns ==================================================================\n\
          \    return {\n        OUTPUT_TRANSACTIONS_KEY: transactions_obj,\n    \
          \    OUTPUT_TABLE_KEY: transactions_table,\n        OUTPUT_PUSHABLE_KEY:\
          \ is_pushable,\n        OUTPUT_ANSWER_KEY: answer,\n    }\n\n"
        code_language: python3
        outputs:
          answer:
            children: null
            type: string
          is_pushable:
            children: null
            type: boolean
          transactions:
            children: null
            type: string
          transactions_table:
            children: null
            type: string
        selected: false
        title: post extract
        type: code

    - data:
        code: "def main(transactions, sheet_name, first_empty_row):\n    rows_from\
          \ = transactions[\"rows\"]\n\n    # generate range\n    sheet_range = \"\
          {}!A{}:H{}\".format(\n        sheet_name, first_empty_row, first_empty_row\
          \ + len(rows_from) - 1\n    )\n\n    # generate values\n    rows_to = []\n\
          \    for row in rows_from:\n        current_row = []\n        for i, col\
          \ in enumerate(row):\n            if i in (2, 3) and col:  # amount in/out\n\
          \                # convert to number for amount in/out col, when not empty\n\
          \                current_row.append(col)\n            else:  # string entry\n\
          \                current_row.append('\"{}\"'.format(col))\n\n        row_content\
          \ = \",\".join(current_row)\n        rows_to.append(row_content)\n\n   \
          \ values = \"[{}]\".format(\",\".join(\"[{}]\".format(row) for row in rows_to))\n\
          \n    result = '[{{\"range\": \"{}\", \"values\": {}}}]'.format(sheet_range,\
          \ values)\n    return {\"result\": result}"

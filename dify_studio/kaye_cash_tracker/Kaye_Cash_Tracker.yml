    - data:
        code: "def main(\n    transactions_array: dict, google_sheet_name: str, empty_row_number:\
          \ float\n):\n    rows_from = transactions_array[\"rows\"]\n\n    end_range_row\
          \ = empty_row_number + len(rows_from) - 1\n\n    # generate range\n    sheet_range\
          \ = \"{}!A{}:H{}\".format(\n        google_sheet_name, empty_row_number,\
          \ end_range_row\n    )\n\n    # generate values\n    rows_to = []\n    for\
          \ row in rows_from:\n        current_row = []\n        for i, col in enumerate(row):\n\
          \            if i in (2, 3) and col:  # amount in/out\n                #\
          \ convert to number for amount in/out col, when not empty\n            \
          \    current_row.append(col)\n            else:  # string entry\n      \
          \          current_row.append('\"{}\"'.format(col))\n\n        row_content\
          \ = \",\".join(current_row)\n        rows_to.append(row_content)\n\n   \
          \ values = \"[{}]\".format(\",\".join(\"[{}]\".format(row) for row in rows_to))\n\
          \n    result = '[{{\"range\": \"{}\", \"values\": {}}}]'.format(sheet_range,\
          \ values)\n\n    return {\"result\": result}\n"
        code_language: python3
        desc: adapt transactions_array to format for google sheet
        outputs:
          result:
            children: null
            type: string

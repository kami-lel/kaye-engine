    - data:
        code: "\"\"\"\ncreate ``data`` for push node\n\n\n:param transactions:\n:type\
          \ transactions: str\n:param column_a:\n:type column_a: list[dict]\n:param\
          \ google_sheet_name:\n:type google_sheet_name: str\n:return: first empty\
          \ row (first available row) in current sheet\n:rtype: int\n\"\"\"\n\nimport\
          \ json\n\nOUTPUT_DATA_KEY = \"data\"\n\n\ndef main(\n    transactions: str,\n\
          \    column_a: list[dict],\n    google_sheet_name: str,\n):  # pylint: disable=missing-function-docstring\n\
          \    transactions_array = json.loads(transactions)\n    # create ranges\
          \  ===========================================================\n    # find\
          \ range's row start, i.e. first empty row\n    range_row_start = len(column_a[0][\"\
          valueRanges\"][0][\"values\"]) + 1\n    range_row_end = range_row_start\
          \ + len(transactions_array) - 1\n    ranges = \"{}!A{}:H{}\".format(\n \
          \       google_sheet_name, range_row_start, range_row_end\n    )\n\n   \
          \ # create values  ===========================================================\n\
          \    rows = []\n    for row in transactions_array:\n        current_row\
          \ = []\n        for i, v in enumerate(row):\n            if i == 0:\n  \
          \              continue  # skip id\n            elif i in (3, 4):  # amount\
          \ in/out\n                # enter as number or empty str\n             \
          \   value = float(v) if v else \"\"\n                current_row.append(value)\n\
          \            else:\n                # enter as str\n                current_row.append(v)\n\
          \n        rows.append(current_row)\n\n    # create data  =============================================================\n\
          \    data = [{\"range\": ranges, \"values\": rows}]\n    data_json = json.dumps(data)\n\
          \    return {OUTPUT_DATA_KEY: data_json}\n\n"
        code_language: python3

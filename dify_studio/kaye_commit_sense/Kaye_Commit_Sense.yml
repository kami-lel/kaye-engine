        - id: 6aad9416-3afe-4894-9b5e-a5955ef9c7e9
          role: system
          text: "{{#env.Style#}} \n\n## Annotation Markers\n\nUsed to label defects\
            \ and related notes across code and documentation. You **must exclusively**\
            \ refer to them as *annotation markers* in all responses\n\n- **immediate\
            \ annotation markers** include `TODO`, `FIXME`, `BUG`, `HACK`\n- **future\
            \ annotation markers** include `todo`, `fixme`, `bug`, `hack`\n\n## prefix\
            \ definitions\n\nPrefixes are listed in **priority** order; apply the\
            \ first rule that matches.\n\n1. ^: new file\n2. !: deleted file\n3. ::\
            \ file relocation with no or minor change, (file name may change or stay\
            \ the same)\n4. =: file rename (location unchanged) with no or minor change\n\
            5. ?: non-textual file change, for example binaries, compressed archives,\
            \ database files, or encrypted blobs\n6. @: only changes to *annotation\
            \ markers* and directly related lines\n7. #: primarily documentation or\
            \ comment changes\n8. ~: primarily content reordering or code refactors\n\
            9. .: only whitespace, indentation, or blank-line changes\n\nIf none of\
            \ the above prefixes apply, choose based on lines changed & change type:\n\
            \n- >25 lines changed\n\n  - predominantly addition: +\n  - predominantly\
            \ deletion: -\n  - mixed modification: *\n\n- <= 25 lines changed\n\n\
            \  - predominantly addition: /\n  - predominantly deletion: \\\n  - mixed\
            \ modification: |\n"
        - id: 72c0659b-4e93-43fe-853b-2aa9dce2cb34
          role: user
          text: '{{#1757062707114.item#}}'

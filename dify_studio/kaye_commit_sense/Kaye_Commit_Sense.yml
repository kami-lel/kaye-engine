    - data:
        code: "\"\"\"\nprocess the full diff content by split content per file,\n\
          and get various information from it\n\n\n:param content:\n:type content:\
          \ str\n:param allows_md:\n:type allows_md: bool\n:return: {\n    \"filename_list\"\
          : a list of all files' name\n    \"per_file_list\": a list of all files'\
          \ diff content\n    \"is_single_file\": if the given content contains only\
          \ single file\n}\n:rtype: dict{\n    \"filename_list\": list[str]\n    \"\
          per_file_list\": list[str]\n    \"is_single_file\": bool\n}\n\"\"\"\n\n\
          import re\n\n# config  #####################################################################\n\
          OUTPUT_FILENAME_LIST_KEY = \"filenames_list\"\nOUTPUT_PER_FILE_LIST_KEY\
          \ = \"per_file_list\"\nOUTPUT_IS_SINGLE_FILE_KEY = \"is_single_file\"\n\
          OUTPUT_ALLOWS_MD_KEY = \"allows_md\"\nOUTPUT_ALLOWS_MD_NUMBER_KEY = \"allows_md_number\"\
          \n\n# constants  ###################################################################\n\
          DIFF_GIT = \"diff --git\"\nREGEX_PATTERN = r\".+\\/(.+)\"\n\n\ndef main(\n\
          \    content: str, allows_md: bool\n):  # pylint: disable=missing-function-docstring\n\
          \    filenames_list = []\n    per_file_list = []\n\n    for segment in content.split(DIFF_GIT)[1:]:\n\
          \        filename = re.match(REGEX_PATTERN, segment).group(1)\n        filenames_list.append(filename)\n\
          \n        per_line = DIFF_GIT + segment\n        per_file_list.append(per_line)\n\
          \n    is_single_file = len(filenames_list) == 1\n\n    return {\n      \
          \  OUTPUT_FILENAME_LIST_KEY: filenames_list,\n        OUTPUT_PER_FILE_LIST_KEY:\
          \ per_file_list,\n        OUTPUT_IS_SINGLE_FILE_KEY: is_single_file,\n \
          \       OUTPUT_ALLOWS_MD_KEY: allows_md,\n        OUTPUT_ALLOWS_MD_NUMBER_KEY:\
          \ 1 if allows_md else 0,\n    }\n\n"
        code_language: python3
        desc: ''
        outputs:
          allows_md:
            children: null
            type: boolean
          allows_md_number:
            children: null
            type: number
          filenames_list:
            children: null
            type: array[string]
          is_single_file:
            children: null
            type: boolean
          per_file_list:
            children: null
            type: array[string]

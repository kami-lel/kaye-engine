    name: prompt_primary_message
    selector:
    - env
    - prompt_primary_message
    value: "### Commentary Case\n- begin 1st sentence with a lowercase letter; use\
      \ standard sentence capitalization for the 2nd and subsequent sentences\n- use\
      \ *Title Case* for **a few important words** within a sentence\n- the last sentence\
      \ should not end with punctuation\n\n    <commentary-case-code-example>\n  \
      \  # this initializes the Variable\n    # check the Config. Validate the Filepath\
      \ with the Tool. Process final result\n    </commentary-case-code-example>\n\
      \n## Briefness Style\n- write in **newspaper headlinese**, prioritize brevity\
      \ over grammar\n- use present for current, infinitive for planned\n- omit articles\
      \ (a, an, the) and helper verbs, use strong nouns, verbs\n- compress with punctuation:\
      \ colon, dash, comma, otherwise minimize, no terminal periods\n- use numerals\
      \ (use 2, not two), symbols, **Usable Abbrs** when unambiguous\n- prefer active\
      \ voice\n- keep sentences short, direct, drop filler\n\n## Kaye Commit Sense\n\
      You are given the result of `git diff --cached`; interpret it as the changes\
      \ ready to be committed for the file(s).\n\n- do **not** using any markdown\
      \ syntax in the output\n- strictly use *Briefness Style* language\n- use *Commentary\
      \ Case* for each line\n\n### Primary Message Task\nSummarize the overall intent\
      \ and major change pattern of all staged files in one clear line under 72 characters\n"
    value_type: string
  - description: ''
    id: 55e58319-b3bf-4e72-98ed-40859e912f90
    name: prompt_per_file_extract_short
    selector:
    - env
    - prompt_per_file_extract_short
    value: "## Annotation Markers\nUsed to label defects and related notes across\
      \ code and documentation. You **must exclusively** refer to them as *annotation\
      \ markers* in all responses\n\n- **immediate annotation markers** include `TODO`,\
      \ `FIXME`, `BUG`, `HACK`\n- **future annotation markers** include `todo`, `fixme`,\
      \ `bug`, `hack`\n\n### Commentary Case\n- begin 1st sentence with a lowercase\
      \ letter; use standard sentence capitalization for the 2nd and subsequent sentences\n\
      - use *Title Case* for **a few important words** within a sentence\n- the last\
      \ sentence should not end with punctuation\n\n    <commentary-case-code-example>\n\
      \    # this initializes the Variable\n    # check the Config. Validate the Filepath\
      \ with the Tool. Process final result\n    </commentary-case-code-example>\n\
      \n## Briefness Style\n- write in **newspaper headlinese**, prioritize brevity\
      \ over grammar\n- use present for current, infinitive for planned\n- omit articles\
      \ (a, an, the) and helper verbs, use strong nouns, verbs\n- compress with punctuation:\
      \ colon, dash, comma, otherwise minimize, no terminal periods\n- use numerals\
      \ (use 2, not two), symbols, **Usable Abbrs** when unambiguous\n- prefer active\
      \ voice\n- keep sentences short, direct, drop filler\n\n### Per File Summary\n\
      Summarize the overall intent and major change pattern of the file in an extremely\
      \ short and concise manner.\n\n#### Prefix Symbol\nYou are to select a single\
      \ prefix that best describes the primary nature of the change to a given file.\
      \ Use the following prefixes, in **priority order**. Apply the **first rule\
      \ that matches**:\n\n1. `^` if the file is a new addition\n2. `!` if the file\
      \ has been deleted\n3. `:` if the file was relocated (moved), with no or only\
      \ minor changes (filename may change or stay the same)\n4. `=` if the file was\
      \ renamed (location unchanged), with no or only minor changes\n5. `?` if the\
      \ file is a non-textual type (e.g., binaries, compressed archives, databases,\
      \ encrypted blobs), and was modified\n6. `@` if the file contains only changes\
      \ to annotation markers and directly related lines\n7. `#` if the change primarily\
      \ concerns documentation or code comments\n8. `~` if the change is primarily\
      \ content reordering or code refactoring\n9. `.` if the change is only whitespace,\
      \ indentation, or blank-line edits\n\nIf none of the above prefixes apply, use\
      \ one of the following to describe the change:\n\n##### Short\n- predominantly\
      \ addition: /\n- predominantly deletion: \\\n- mixed modification: |\n"
    value_type: string
  - description: ''

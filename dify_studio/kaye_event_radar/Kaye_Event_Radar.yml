    - data:
        code: "def _filter_events(events, filtered_events_names):\n    \"\"\"\n  \
          \  :param events:\n    :type events: list[dict]\n    :param filtered_events_names:\n\
          \    :type filtered_events_names: list[str]\n    :return: filter ``events``\n\
          \            by keep only those with names appeared in ``filtered_events_names``\n\
          \    :rtype: list[dict]\n    \"\"\"\n    return [\n        event for event\
          \ in events if event[\"name\"] in filtered_events_names\n    ]\n\n\ndef\
          \ main(events: list[dict], filtered_events_names: list[str]):\n    \"\"\"\
          \n    filter ``events`` by selecting only those names appeared in ``names``\n\
          \n\n    :param events:\n    :type events: list[dict]\n    :param names:\n\
          \    :type names: list[str]\n    :return: ``opt`` is filtered events, (identical\
          \ structure as ``events``)\n    \"\"\"\n    opt = [event for event in events\
          \ if event[\"name\"] in filtered_events_names]\n    return {\"output\":\
          \ opt}\n\n"
        code_language: python3

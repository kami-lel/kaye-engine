    - data:
        code: "from datetime import timedelta, date as date_cls\n\nEVENTBRITE_URL\
          \ = \"https://www.eventbrite.com/d/ca--los-angeles/all-events/?page=1&start_date={}&end_date={}\"\
          \nEVENTBRITE_DATE = \"%Y-%m-%d\"\nDOWNTOWN_LA_URL = \"https://downtownla.com/calendar#{}-to-{}\"\
          \nDOWNTOWN_LA_DATE = \"%m-%d-%y\"\nLA_LIVE_URL = \"https://www.lalive.com/events/filter/{}/{}/\"\
          \nLA_LIVE_DATE = \"%Y-%m-%d\"\nDISCOVER_LA_URL = \"https://www.discoverlosangeles.com/events\"\
          \n\n\ndef _create_date_range():\n    \"\"\"\n    create a date range starting\
          \ **today**, and ending on **coming Sunday**,\n    spanning for at max 1\
          \ week\n\n\n    :return: start & end date\n    :rtype: tuple(datetime.date,\
          \ datetime.date)\n    \"\"\"\n    start_date = date_cls.today()\n\n    #\
          \ find coming Sunday\n    days_ahead = ((6 - start_date.weekday()) % 7)\
          \ or 7\n    end_date = start_date + timedelta(days=days_ahead)\n\n    return\
          \ start_date, end_date\n\n\ndef main():\n    \"\"\"\n    dynamically create\
          \ information for scarping various websites\n\n\n    :return: ``opt`` is\
          \ a ``list`` of urls (``str``) to be scraped\n    \"\"\"\n\n    start_date,\
          \ end_date = _create_date_range()\n\n    # create urls  -------------------------------------------------------------\n\
          \    opt = []\n\n    # eventide\n    # Fixme only search 1st page\n    opt.append(\n\
          \        EVENTBRITE_URL.format(\n            start_date.strftime(EVENTBRITE_DATE),\n\
          \            end_date.strftime(EVENTBRITE_DATE),\n        )\n    )\n\n \
          \   # downtownla.com\n    opt.append(\n        DOWNTOWN_LA_URL.format(\n\
          \            start_date.strftime(DOWNTOWN_LA_DATE),\n            end_date.strftime(DOWNTOWN_LA_DATE),\n\
          \        )\n    )\n\n    # Discover LA\n    opt.append(DISCOVER_LA_URL)\n\
          \n    # LA Live.com\n    opt.append(\n        LA_LIVE_URL.format(\n    \
          \        start_date.strftime(LA_LIVE_DATE),\n            end_date.strftime(LA_LIVE_DATE),\n\
          \        )\n    )\n\n    # return all urls  ---------------------------------------------------------\n\
          \    return {\"output\": opt}\n\n"

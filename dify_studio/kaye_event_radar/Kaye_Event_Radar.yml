    - data:
        code: "from datetime import date as date_cls\n\nEVENT_TEMPLATE = \"\"\"##\
          \ [{name}]({link})\n\n- \U0001F552 `{time}`\n- \U0001F4B0 {price}\n- \U0001F4CD\
          \ <ins>{location}</ins>\n\n{summary}\n\n\"\"\"\n\n\ndef _create_date_line(date):\n\
          \    \"\"\"\n    :param date:\n    :type date: datetime.date\n    :return:\
          \ a ``md`` heading line containing day-of-week and date\n    :rtype: str\n\
          \    \"\"\"\n    month_str, day_str = date.split(\"-\")\n    dt = date_cls(date_cls.today().year,\
          \ int(month_str), int(day_str))\n    weekday = dt.strftime(\"%a\")\n   \
          \ return \"# {weekday} {date}\\n\".format(weekday=weekday, date=date)\n\n\
          \ndef main(filtered_events: list[dict]):\n    \"\"\"\n    create a well-formatted\
          \ ``md`` text answer of ``filtered_events``\n\n    :param filtered_events:\n\
          \    :type filtered_events: list[dict]\n    :return: ``opt`` is the formatted\
          \ text answer (typed ``str``)\n    \"\"\"\n\n    # tab by date  -------------------------------------------------------------\n\
          \    by_dates = {}\n\n    for event in filtered_events:\n        date =\
          \ event[\"date\"]\n        if date not in by_dates:\n            by_dates[date]\
          \ = []  # init a new list\n\n        by_dates[date].append(event)\n\n  \
          \  # create md result  --------------------------------------------------------\n\
          \    answer_parts = []\n\n    for date, events_of_day in sorted(by_dates.items()):\n\
          \        answer_parts.append(_create_date_line(date))\n\n        for event\
          \ in events_of_day:\n            answer_parts.append(EVENT_TEMPLATE.format(**event))\n\
          \n    opt = \"\".join(answer_parts)\n    return {\"output\": opt}\n\n"
        code_language: python3
        outputs:
          output:
            children: null
            type: string
        selected: false
        title: gen answer
        type: code
        variables:
        - value_selector:
          - '1763926842007'
          - output
          value_type: array[object]
          variable: filtered_events

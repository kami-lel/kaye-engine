  environment_variables:
  - description: ''
    id: 1517f83c-f57f-4fcf-b884-2354a69b055c
    name: FILTER_EVENTS_PROMPT
    selector:
    - env
    - FILTER_EVENTS_PROMPT
    value: '### filter events

      - Select all events loosely related to the provided *Interested Topics*

      - Return an array of event `name` exactly as given


      {INTERESTED_TOPICS}

      <!-- blueprint: filter_events; Kaye v4.9.2a0.020251123115422 -->

      '
    value_type: string
  - description: ''
    id: 81741d5c-0cb7-404c-9b8e-45dcc96c03d7
    name: PARSE_EVENTS_PROMPT
    selector:
    - env
    - PARSE_EVENTS_PROMPT
    value: "## Briefness Style\n- write in **newspaper headlinese**, prioritize brevity\
      \ over grammar\n- use present for current, infinitive for planned\n- omit articles\
      \ (a, an, the) and helper verbs, use strong nouns, verbs\n- compress with punctuation:\
      \ colon, dash, comma, otherwise minimize, no terminal periods\n- use numerals\
      \ (use 2, not two), symbols, **Usable Abbrs** when unambiguous\n- prefer active\
      \ voice\n- keep sentences short, direct, drop filler\n\n### parse events\nParse\
      \ all events into the desired format, keep all information.\n\n##### price field\n\
      \n- Extract admission price or fee; mention if registration or sign-up is required\n\
      - Indicate separate prices for groups (e.g., adults, children) if applicable\n\
      - Use `\U0001F193` if the event is free\n- Use `❓` if fee info is unknown\n\
      - Examples:\n  - $15\n  - $5 early bird, $15 at door\n  - \U0001F193, need registration\n\
      \n##### summary field\n\n- Write a concise summary using *Briefness Style*\n\
      - Use multiple lines; prefer short line width for each line\n- Do not repeat\
      \ information from previous fields\n- Use **bold** for key words\n- Add expressive\
      \ emojis within the text where relevant\n<!-- blueprint: parse_events; Kaye\
      \ v4.9.2a0.020251123112456 -->\n"
    value_type: string
  - description: ''
    id: 4c510f56-e1fb-44e2-aae9-3a9e848524d3

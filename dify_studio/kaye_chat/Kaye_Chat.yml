    - data:
        code: "# pylint: disable=missing-module-docstring\n\nimport json\n\n# Output\
          \ Keys  #################################################################\n\
          \nOUTPUT_BODY_KEY = \"getter_request_body\"\nOUTPUT_QUERY_KEY = \"truncated_query\"\
          \n\n\n# Body Key  ####################################################################\n\
          BODY_ROLE_KEY = \"pre_sense_role\"\nBODY_DIFF_KEY = \"difficulty_override\"\
          \n\n\n# constants  ###################################################################\n\
          QUERY_LINE_LIMIT = 100\n\n\n# Entry Point  #################################################################\n\
          def main(current_role: str, difficulty_override: int, query: str):\n   \
          \ \"\"\"\n    :param current_role:\n    :type current_role: str\n    :param\
          \ difficulty_override:\n    :type difficulty_override: int\n    :param query:\n\
          \    :type query: str\n    :return: {\n            \"getter_request_body\"\
          :  body sent to ``/sense`` endpoint\n            \"truncated_query\":  \
          \    query truncated for sense node\n    }\n    :rtype: dict{\n        \
          \    \"getter_request_body\":  str\n            \"truncated_query\":   \
          \    str\n    }\n    \"\"\"\n    # body  --------------------------------------------------------------------\n\
          \    getter_body = json.dumps(\n        {BODY_ROLE_KEY: current_role, BODY_DIFF_KEY:\
          \ difficulty_override}\n    )\n\n    # truncate query  ----------------------------------------------------------\n\
          \    # split as lines and remove empty lines\n    lines = [line for line\
          \ in query.splitlines() if line.strip()]\n\n    if len(lines) > QUERY_LINE_LIMIT:\n\
          \        n = QUERY_LINE_LIMIT // 2\n        head = lines[:n]\n        tail\
          \ = lines[-n:]\n        truncated_query = \"\\n\".join(head + tail)\n\n\
          \    else:  # short, no no op\n        truncated_query = query\n\n    return\
          \ {\n        OUTPUT_BODY_KEY: str(getter_body),\n        OUTPUT_QUERY_KEY:\
          \ str(truncated_query),\n    }\n\n"
        code_language: python3

    - data:
        code: "# pylint: disable=missing-module-docstring\n# pylint: disable=too-many-arguments\n\
          # pylint: disable=too-many-positional-arguments\n\n\n# output keys  #################################################################\n\
          OUTPUT_LLM_KEY = \"llm\"\n\n\n# Entry Point  #################################################################\n\
          def main(\n    role: str,\n    llm_override: str,\n    llm_sensed: str,\n\
          \    difficulty_override: float,\n    difficulty_sensed: float,\n    difficulty_thresholds:\
          \ list[float],\n):\n    \"\"\"\n    decide which LLM (branch) for this round\
          \ of conversation\n\n\n    :param role:\n    :type role: str\n    :param\
          \ llm_override:\n    :type llm_override: str\n    :param llm_sensed:\n \
          \   :type llm_sensed: str\n    :param difficulty_override:\n    :type difficulty_override:\
          \ float\n    :param difficulty_sensed:\n    :type difficulty_sensed: float\n\
          \    :param difficulty_thresholds:\n            difficulty thresholds given\
          \ as environment variable\n    :type difficulty_thresholds: list[float]\n\
          \    :return: {\"llm\": LLM to use for this round of conversation}\n   \
          \ :rtype: dict{\"llm\": str}\n    \"\"\"\n    if llm_override:\n       \
          \ llm = llm_override\n\n    elif role == \"coder\":\n\n        difficulty\

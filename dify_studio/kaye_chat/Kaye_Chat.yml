workflow:
  conversation_variables:
  - description: a sequence (memory) of difficulty values of recent rounds
    id: 25015b77-07a1-4439-9701-2ac22c38579e
    name: difficulties_memory
    selector:
    - conversation
    - difficulties_memory
    value: []
    value_type: array[number]
  - description: difficulty assumed for current round
    id: 878026cb-1d0e-4e68-b30b-e0246871644a
    name: current_difficulty
    selector:
    - conversation
    - current_difficulty
    value: 0
    value_type: integer
  - description: usages data of task LLM nodes
    id: 1131a781-78d0-4ff1-b0d2-955f817187d2
    name: task_usages
    selector:
    - conversation
    - task_usages
    value: {}
    value_type: object
  - description: LLMs used in current round
    id: bbb31147-b512-4af8-8850-42c4d78beaba
    name: current_llms
    selector:
    - conversation
    - current_llms
    value: []
    value_type: array[string]
  - description: prompt used during task nodes
    id: bf733c0a-ea00-40c8-9297-89294adf149c
    name: task_prompt
    selector:
    - conversation
    - task_prompt
    value: ''
    value_type: string
  - description: programming langauges used for current round if coder
    id: ef0e3e77-5565-4bdb-abd4-ecd48ad1768a
    name: current_pls
    selector:
    - conversation
    - current_pls
    value: ''
    value_type: string
  - description: role for current round
    id: d60b9a69-4ecb-432d-98c7-f225bab21243
    name: current_role
    selector:
    - conversation
    - current_role
    value: ''
    value_type: string
  environment_variables:
  - description: Kaye Flask API's Port Number; default is "11255", debug is "11256"
    id: b388f1c7-41bc-45c7-b45f-97dbc96ebd42
    name: FLASK_API_PORT
    selector:
    - env
    - FLASK_API_PORT
    value: '11255'
    value_type: string
  - description: Kaye Flask API's URL accessible to this Dify App, e.g. "http://11.22.33.44"
    id: 97ae005c-5fd3-4092-a255-07b2fd514b55
    name: FLASK_API_URL
    selector:
    - env
    - FLASK_API_URL
    value: ''
    value_type: secret
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      - document
      allowed_file_upload_methods:
      - remote_url
      - local_file
      enabled: true
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_batch_limit: 10
        image_file_size_limit: 10
        single_chunk_attachment_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 10
    opening_statement: ''
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions: []
    suggested_questions_after_answer:

        code: "# pylint: disable=missing-module-docstring\n# pylint: disable=too-many-arguments\n\
          # pylint: disable=too-many-positional-arguments\n\n\n# output keys  #################################################################\n\
          OUTPUT_META_KEY = \"meta_content\"\n\n\n# constants  ###################################################################\n\
          USAGE_TIME_KEY = \"time_to_generate\"\nUSAGE_TOKEN_KEY = \"total_tokens\"\
          \n\nROLE2PRINTABLE_NAME = {\n    \"art\": \"\U0001F3A8Art Tutor\",\n   \
          \ \"barista\": \"☕️Barista\",\n    \"changelog\": \"\U0001F504Changelog\
          \ Writer\",\n    \"chat\": \"\U0001F4ACChat\",\n    \"coder\": \"\U0001F9EC\
          Kaye Peer Coder\",\n    \"deutschlehrer\": \"\U0001F1E9\U0001F1EADeutschlehrer\"\
          ,\n    \"editor\": \"✍️Editor\",\n    \"librarian\": \"\U0001F3DB️Librarian\"\
          ,\n    \"prompt\": \"\U0001F58A️Prompt Writer\",\n    \"rapid\": \"⚡️Rapid\"\
          ,\n    \"secretary\": \"\U0001F4BCSecretary\",\n    \"tarot\": \"\U0001F52E\
          Tarot Reader\",\n}\n\n\n# helpers  #####################################################################\n\
          def _generate_usage_line(usage):\n    return \"`{}`s\\t`{}`t\".format(usage[USAGE_TIME_KEY],\
          \ usage[USAGE_TOKEN_KEY])\n\n\ndef _generate_llm_usage_line(llm, usage):\n\
          \    return \"*{}*\\t{}\".format(llm, _generate_usage_line(usage))\n\n\n\
          # Entry Point  #################################################################\n\
          def main(\n    show_meta_content: bool,\n    should_skip_sense: bool,\n\
          \    current_role: str,\n    current_pls: str,\n    sense_usage: dict,\n\
          \    is_direct_response,\n    task_usages: dict,\n    merger_usage: dict,\n\
          \    difficulties_memory: list[int],\n    decayed_difficulty: int,\n   \
          \ used_difficulty: int,\n    current_difficulty: int,\n):\n    \"\"\"\n\
          \    generate meta content for debug\n\n\n    :param show_meta_content:\n\
          \    :type show_meta_content: bool\n    :param should_skip_sense:\n    :type\
          \ should_skip_sense: bool\n    :param current_role:\n    :type current_role:\
          \ str\n    :param current_pls:\n    :type current_pls: str\n    :param sense_usage:\n\
          \    :type sense_usage: dict\n    :param is_direct_response:\n    :type\
          \ is_direct_response: bool\n    :param task_usages:\n    :type task_usages:\
          \ dict\n    :param merger_usage:\n    :type merger_usage: dict\n    :param\
          \ difficulties_memory:\n    :type difficulties_memory: list[int]\n    :param\
          \ decayed_difficulty:\n    :type decayed_difficulty: int\n    :param used_difficulty:\n\
          \    :type used_difficulty: int\n    :param current_difficulty:\n    :type\
          \ current_difficulty: int\n    :return: {\"meta_content\": meta content\
          \ for debug}\n    :rtype: dict{\"meta_content\": str}\n    \"\"\"\n    if\
          \ not show_meta_content:\n        return {OUTPUT_META_KEY: \"\"}\n\n   \
          \ lines = []\n\n    # sense-related  -----------------------------------------------------------\n\
          \    if not should_skip_sense:\n        lines.append(\"Sensed:\\t\" + _generate_usage_line(sense_usage))\n\
          \n    # task parameters  ---------------------------------------------------------\n\
          \    lines.append(\n        \"Role:\\t{}\".format(\n            ROLE2PRINTABLE_NAME[current_role]\n\
          \            if current_role in ROLE2PRINTABLE_NAME\n            else current_role\n\
          \        )\n    )\n    lines.append(\"**Difficulty** Used:\\t{}\".format(used_difficulty))\n\
          \    lines.append(\n        \"{}:\\t{}\".format(\n            (\"Pre-Determined\"\
          \ if should_skip_sense else \"Sensed\"),\n            current_difficulty,\n\
          \        )\n    )\n    lines.append(\n        \"Decayed:\\t{}<-`{}`\".format(decayed_difficulty,\
          \ difficulties_memory)\n    )\n\n    if current_role == \"coder\":\n   \
          \     lines.append(\"PLs:\\t{}\".format(current_pls))\n\n    # task ---------------------------------------------------------------------\n\
          \    if is_direct_response:\n        ((llm, usage),) = task_usages.items()\n\
          \        lines.append(\"Task:\\t\" + _generate_llm_usage_line(llm, usage))\n\
          \    else:\n        lines.append(\"Task:\")\n        for llm, usage in task_usages.items():\n\
          \            lines.append(_generate_llm_usage_line(llm, usage))\n\n    \
          \    lines.append(\"Merger:\\t\" + _generate_usage_line(merger_usage))\n\
          \n    # final content form  ------------------------------------------------------\n\
          \    meta_content = \"\"\"\n\n> [!TIP]\n\"\"\" + \"\\n\".join(\"> \" + line\
          \ for line in lines)\n\n    return {OUTPUT_META_KEY: str(meta_content)}\n\
          \n"

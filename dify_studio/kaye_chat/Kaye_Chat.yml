    - data:
        code: "# pylint: disable=missing-module-docstring\n\n\n# output keys  #################################################################\n\
          OUTPUT_ROLE_KEY = \"role\"\nOUTPUT_SKIP_KEY = \"skip_sense\"\n\n\n# helpers\
          \  #####################################################################\n\
          def should_skip_sense(role, llm_override):\n    \"\"\"\n    decide whether\
          \ should skip sense node for this round of conversation\n    based on combination\
          \ of difficulty & LLM overrides given\n\n\n    :param role:\n    :type role:\
          \ str\n    :param llm_override:\n    :type llm_override: str\n    :return:\
          \ whether should skip sense node\n    :rtype: bool\n    \"\"\"\n    if role\
          \ == \"barista\":\n        # skip for Assistant Barista\n        return\
          \ True\n\n    elif role == \"changelog\":\n        # skip for Changelog\
          \ writer\n        return True\n\n    elif role:\n        # both both & LLM\
          \ are provided\n        return bool(llm_override)\n\n    return False\n\n\
          \n# Entry Point  #################################################################\n\
          def main(\n    role_override: str,\n    llm_override: str,\n    current_role:\
          \ str,\n):\n    \"\"\"\n    prepare parameters for **this round**\n    based\
          \ on variables provided by *User Input Fields*\n\n\n    :param role_override:\n\
          \    :type role_override: str\n    :param llm_override:\n    :type llm_override:\
          \ str\n    :param current_role: role saved in conversation variable,\n \
          \           often decided on 1st round of conversation\n    :type current_role:\
          \ str\n    :return: {\n            \"role\": role to used for this round\
          \ of conversation,\n            \"skip_sense\": whether skip sense node\
          \ in this round}\n    :rtype: dict{\"role\": str, \"skip_sense\": bool}\n\
          \    \"\"\"\n    # decide role  =============================================================\n\
          \    role = role_override or current_role or \"\"\n\n    skip_sense = should_skip_sense(role,\
          \ llm_override)\n\n    return {OUTPUT_ROLE_KEY: role, OUTPUT_SKIP_KEY: skip_sense}\n\
          \n"
        code_language: python3
        outputs:
          role:
            children: null
            type: string
          skip_sense:
            children: null
            type: boolean

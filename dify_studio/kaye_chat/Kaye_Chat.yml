          OUTPUT_COMBINED_KEY = \"combined_pls\"\nOUTPUT_ROLE_KEY = \"role\"\n\n\n\
          # constant  ####################################################################\n\
          SPLITTER = \",\"\n\n\n# Entry Point  #################################################################\n\
          def main(\n    current_pls: str,\n    sensed_pls: dict,\n    current_role:\
          \ str,\n    sensed_role: dict,\n):\n    \"\"\"\n    collect & organize information\

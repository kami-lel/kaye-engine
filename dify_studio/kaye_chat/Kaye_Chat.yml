          def main(iteration_output: list[dict]):\n    \"\"\"\n    :param iteration_output:\n\
          \    :type iteration_output: list[list]\n    :return: {\n        \"flattened_answers\"\
          :    all LLMs' answer flattened as single md document\n        \"task_usages\"\
          :          task usages of all LLMs\n    }\n    :rtype: dict{\n        \"\
          flattened_answers\":    str\n        \"task_usages\":          dict\n  \
          \  }\n    \"\"\"\n\n    answer_parts = []\n    task_usages = {}\n\n    for\
          \ i, iteration_result in enumerate(iteration_output, 1):\n        llm =\
          \ iteration_result[\"llm\"]\n        usage = iteration_result[\"usage\"\
          ]\n        answer = iteration_result[\"answer\"]\n\n        answer_parts.append(\"\
          # Answer {}\\n{}\".format(i, answer))\n        task_usages[llm] = usage\n\
          \n    answers = \"\\n----\\n\".join(answer_parts)\n\n    # Output Variables\
          \  --------------------------------------------------------\n    return\
          \ {OUTPUT_ANSWER_KEY: str(answers), OUTPUT_TASK_KEY: task_usages}\n\n"

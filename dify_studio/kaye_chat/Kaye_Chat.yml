    - data:
        code: "# pylint: disable=missing-module-docstring\n# pylint: disable=too-many-arguments\n\
          \n\nimport json\n\n# Output Key ###################################################################\n\
          OUTPUT_BODY_KEY = \"task_prompt_getter_body\"\nOUTPUT_LLMS_KEY = \"llms\"\
          \nOUTPUT_MEMORY_KEY = \"difficulties_memory\"\nOUTPUT_DECAYED_KEY = \"decayed_difficulty\"\
          \nOUTPUT_USED_KEY = \"used_difficulty\"\nOUTPUT_DIRECT_KEY = \"is_direct_response\"\
          \n\n\n# constants  ###################################################################\n\
          THRESHOLDS = [\n    (0, [\"gpt-4-nano\"]),\n    (10, [\"gpt-5-nano\"]),\n\
          \    (30, [\"claude-sonnet-4\"]),\n    (60, [\"claude-sonnet-4\", \"gpt-5-mini\"\
          ]),\n    (80, [\"claude-opus-4\", \"gpt-5\"]),\n    (90, [\"claude-opus-4\"\
          , \"gpt-5\", \"gemini-3-pro\"]),\n]\n# (lower bounds, LLMs to use)\n\n\n\
          # number of rounds to remember difficulties\nDIFFICULTY_MEMORY_CNT = 8\n\
          \n# Exponential Moving Average: Alpha, smoothing factor\nEMA_ALPHA = 0.6\n\
          \n\n# Entry Point  #################################################################\n\
          def main(\n    query: str,\n    current_role: str,\n    current_pls: str,\n\
          \    difficulties_memory: list[int],\n    current_difficulty: int,\n):\n\
          \    \"\"\"\n    :param query:\n    :type query: str\n    :param current_role:\n\
          \    :type current_role: str\n    :param current_pls:\n    :type current_pls:\
          \ str\n    :param difficulty:\n    :type difficulty: int\n    :return: {\n\
          \        \"task_prompt_getter_body\":  body sent to /task\n        \"llms\"\
          :                     LLMs to use during tasks\n        \"difficulties_memory\"\
          \n        \"is_direct_response\":       whether use direct response mode\
          \ during task\n    }\n\n    :rtype: dict{\n        \"task_prompt_getter_body\"\
          :  str,\n        \"llms\":                     list[str],\n        \"difficulties_memory\"\
          :      list[int],\n        \"is_direct_response\":       bool,\n    }\n\
          \    \"\"\"\n\n    # gen body  ----------------------------------------------------------------\n\
          \    # used for Task Prompt Getter node\n\n    body = {\n        \"query\"\
          : query,\n        \"role\": current_role,\n        \"programming_languages\"\
          : current_pls,\n    }\n    body_json_dumps = json.dumps(body)\n\n    # decaying\
          \ difficulty  -----------------------------------------------------\n  \
          \  difficulties_memory.append(int(current_difficulty))\n    # keep only\
          \ recent (last) rounds\n    difficulties_memory = difficulties_memory[-DIFFICULTY_MEMORY_CNT:]\n\
          \n    # calc decaying difficulty\n    ema = float(difficulties_memory[0])\
          \ if difficulties_memory else 0.0\n    for d in difficulties_memory[1:]:\n\
          \        ema = EMA_ALPHA * d + (1.0 - EMA_ALPHA) * ema\n    decayed_difficulty\
          \ = max(1, min(100, round(ema)))\n\n    # always use higher value of two\n\
          \    used_difficulty = max(current_difficulty, decayed_difficulty)\n\n \
          \   # decide LLMs to use  ------------------------------------------------------\n\
          \    llms = THRESHOLDS[0][1]\n    for threshold, value in THRESHOLDS:\n\
          \        if used_difficulty >= threshold:\n            llms = value\n\n\
          \    # is direct  ---------------------------------------------------------------\n\
          \    is_direct_response = len(llms) == 1\n\n    # Output Variables  --------------------------------------------------------\n\
          \    return {\n        OUTPUT_BODY_KEY: str(body_json_dumps),\n        OUTPUT_LLMS_KEY:\
          \ llms,\n        OUTPUT_MEMORY_KEY: difficulties_memory,\n        OUTPUT_DIRECT_KEY:\
          \ bool(is_direct_response),\n        OUTPUT_DECAYED_KEY: decayed_difficulty,\n\
          \        OUTPUT_USED_KEY: used_difficulty,\n    }\n\n"
        code_language: python3
        outputs:
          decayed_difficulty:
            children: null
            type: number
          difficulties_memory:
            children: null
            type: array[number]
          is_direct_response:
            children: null
            type: boolean
          llms:
            children: null
            type: array[string]
          task_prompt_getter_body:
            children: null
            type: string
          used_difficulty:
            children: null
            type: number

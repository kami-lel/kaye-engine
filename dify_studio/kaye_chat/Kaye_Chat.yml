    - data:
        code: "# pylint: disable=missing-module-docstring\n\n\n# Output Keys  #################################################################\n\
          \nOUTPUT_SKIP_KEY = \"should_skip_sense\"\nOUTPUT_ROLE_KEY = \"role\"\n\
          OUTPUT_DIFF_KEY = \"difficulty\"\n\n# constants  ###################################################################\n\
          \n# roles w/ static difficulty associated with it, thus should skip sense\n\
          STATIC_DIFFICULTY_ROLES = {\n    \"art\": 52,\n    \"barista\": 40,\n  \
          \  \"changelog\": 35,\n    \"deutschlehrer\": 55,\n    \"editor\": 47,\n\
          \    \"prompt\": 85,\n    \"rapid\": 1,\n    \"tarot\": 46,\n    \"shelver\"\
          : 35,\n}\n\n\n# Body Key  ####################################################################\n\
          BODY_ROLE_KEY = \"pre_sense_role\"\nBODY_DIFF_KEY = \"difficulty_override\"\
          \n\n\n# Entry Point  #################################################################\n\
          def main(\n    role_override: str,\n    difficulty_override: int,\n    current_role:\
          \ str,\n):\n    \"\"\"\n    :param role_override:\n    :type role_override:\
          \ str\n    :param difficulty_override:\n    :type difficulty_override: int\n\
          \    :param current_role:\n    :type current_role: str\n    :return: dict{\n\
          \        \"should_skip_sense\":        whether should skip sense node in\
          \ this round\n        \"role\":                     current round role (so\
          \ far)\n        \"difficulty\":               current round difficulty (so\
          \ far)\n    }\n    :rtype: dict{\n        \"should_skip_sense\":       \
          \ bool\n        \"role\":                     str\n        \"difficulty\"\
          :               int\n    }\n    \"\"\"\n    # decide role  -------------------------------------------------------------\n\
          \    # role_override take priority\n    # empty indicates sense node to\
          \ decide it during 1st round\n    role = role_override or current_role or\
          \ \"\"\n\n    # decide skip & diff  ------------------------------------------------------\n\
          \    skip = False\n    diff = 0\n\n    if role in STATIC_DIFFICULTY_ROLES:\n\
          \        skip = True\n        diff = STATIC_DIFFICULTY_ROLES[role]\n\n \
          \   elif role == \"coder\":\n        pass  # coder never skip\n\n    elif\
          \ role:\n        skip = difficulty_override != 0\n\n    # override difficulty\
          \ from input\n    if difficulty_override != 0:\n        diff = difficulty_override\n\
          \n    # Output Variables  --------------------------------------------------------\n\
          \    return {\n        OUTPUT_SKIP_KEY: bool(skip),\n        OUTPUT_ROLE_KEY:\
          \ str(role),\n        OUTPUT_DIFF_KEY: int(diff),\n    }\n\n"
        code_language: python3

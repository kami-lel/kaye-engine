    - data:
        code: "from enum import IntFlag, auto\n\n# constants  ###################################################################\n\
          PROMPT_KEY_IN_CACHE = \"task_prompt\"\nFLAGS_KEY_IN_CACHE = \"flags\"\n\
          OUTPUT_PROMPT_KEY = \"task_prompt\"\nOUTPUT_CACHES_KEY = \"updated_caches\"\
          \n\n\nclass PL(IntFlag):\n    \"\"\"\n    represent a single programming\
          \ language\n    \"\"\"\n\n    NONE = 0\n\n    # pylint: disable=invalid-name\n\
          \n    # abbreviations defined in prompt corpus\n    c = auto()\n    cpp\
          \ = auto()\n    ue = auto()\n    csharp = auto()\n    u3d = auto()\n   \
          \ console = auto()\n    css = auto()\n    html = auto()\n    js = auto()\n\
          \    ts = auto()\n    py = auto()\n\n\ndef _calc_flags(languages):\n   \
          \ flags = PL.NONE\n\n    try:\n        if languages:  # when languages list\
          \ is not empty\n            for lang in languages.split(\",\"):\n      \
          \          flags |= PL[lang]\n\n    except ValueError as err:\n        raise\
          \ ValueError(\n            \"contains unsupported language: {}\".format(languages)\n\
          \        ) from err\n\n    return flags\n\n\ndef main(languages: str, caches:\
          \ dict):\n    \"\"\"\n    :param languages: languages list, e.g. ``'cpp,py'``\n\
          \    :type languages: str\n    :param caches: Conversation Variable ``caches``\n\
          \    :type caches: dict\n    :return:\n\n    {\n        \"task_prompt\"\
          :\n                task prompt generated from API, or fetched from cache,\n\
          \        \"updated_caches\": updated ``caches``\n    }\n    :rtype: dict{'task_prompt':\
          \ str, \"updated_caches\": dict}\n    \"\"\"\n    flags = _calc_flags(languages)\n\
          \n    try:\n        cached_flags = PL(int(caches[FLAGS_KEY_IN_CACHE]))\n\
          \    except KeyError:\n        cached_flags = PL.NONE\n\n    if flags ==\
          \ cached_flags and cached_flags:\n        # identical language requirement,\
          \ thus send cached prompt\n        return {\n            OUTPUT_PROMPT_KEY:\
          \ caches[PROMPT_KEY_IN_CACHE],\n            OUTPUT_CACHES_KEY: caches,\n\
          \        }\n\n    # get prompt  --------------------------------------------------------------\n\
          \    flags |= cached_flags  # combined with previous languages\n\n    if\
          \ flags == 0:  # no programming\n        task_prompt = \"basic\"  # Todo\
          \ use API\n\n    else:\n        # contains additional required languages\n\
          \        task_prompt = \"basic + {}\".format(repr(flags))  # Todo use API\n\
          \n    # update Conversation Variable caches\n    caches[FLAGS_KEY_IN_CACHE]\
          \ = flags\n    caches[PROMPT_KEY_IN_CACHE] = task_prompt\n\n    return {\n\
          \        OUTPUT_PROMPT_KEY: task_prompt,\n        OUTPUT_CACHES_KEY: caches,\n\
          \    }\n\n"
        code_language: python3
        outputs:
          task_prompt:
            children: null
            type: string
          updated_caches:
            children: null
            type: object

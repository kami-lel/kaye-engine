    - data:
        code: "\"\"\"\nget `pre-sense` node's prompts from Kaye's Flask API\n\"\"\"\
          \n\nKEY_IN_PROMPTS_CACHE = \"pre-sense\"\n\n\nBLUEPRINT = \"\"\" ○\n[x]\
          \ ├── Role\n[x] │   └── Kaye Peer Coder\n[x] │       └── pre-sense\n[x]\
          \ └── Abbreviations\n[x]     └── Programming Languages\n\"\"\"\n\n\ndef\
          \ main(prompts_cache: dict):\n    # prompt already in cache\n    if KEY_IN_PROMPTS_CACHE\
          \ in prompts_cache:\n        system_message = prompts_cache[KEY_IN_PROMPTS_CACHE]\n\
          \n    else:\n        # get prompt from API  -------------------------------------------------\n\
          \        # Todo use API\n        system_message = \"\"\"\n## Kaye Peer Coder\n\
          \n### pre-sense\n\nHere is an improved and clarified version of your prompt:\n\
          \nExtract the following two variables:\n\n- difficulty: Provide a number\
          \ between `0.0` (very easy) and `1.0` (very hard) that represents the assumed\
          \ difficulty of the user's proposed task. You may use as many decimal places\
          \ as necessary for appropriate precision.\n\n- languages: Return an array\
          \ containing the abbreviations of programming languages (as defined below)\
          \ required by the user. For example, `['py', 'cpp']`. If the conversation\
          \ does not mention any specific programming language, such as in cases involving\
          \ conceptual or general algorithms, return an empty array (`[]`).\n\n##\
          \ Programming Languages\n\n(`abbr`: explanation & alternative names)\n\n\
          - `c`: **C**\n- `cpp`: **C++**, cpp, or cxx\n\n  - `ue`: **Unreal** Engine\
          \ code using C++\n\n- `csharp`: **C#**, or cs\n\n  - `u3d`: **Unity** Engine\
          \ code using C#\n\n- `console`: any types of terminal console\n- `css`:\
          \ CSS\n- `html`: HTML\n- `js`: JavaScript\n- `ts`: TypeScript\n- `py`: Python\n\
          \"\"\"\n        # update Conversation Variable\n        prompts_cache[KEY_IN_PROMPTS_CACHE]\
          \ = system_message\n\n    return {\"system_message\": system_message, \"\
          prompts_cache\": prompts_cache}\n\n"
        code_language: python3
        desc: ''
        outputs:
          system_message:
            children: null
            type: string
          updated_prompts_cache:
            children: null
            type: object
        selected: false
        title: pre-sense prompt getter
        type: code

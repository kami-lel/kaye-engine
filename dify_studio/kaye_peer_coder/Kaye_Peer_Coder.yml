    - data:
        code: "BLUEPRINT = \"\"\" ○\n[x] ├── Role\n[x] │   └── Kaye Peer Coder\n[x]\
          \ │       └── pre-sense\n[x] └── Abbreviations\n[x]     └── Programming\
          \ Languages\n\"\"\"\n\n\n# constants  ###################################################################\n\
          PROMPT_KEY_IN_CACHE = \"pre_sense_prompt\"\nOUTPUT_PROMPT_KEY = \"presense_prompt\"\
          \nOUTPUT_CACHES_KEY = \"updated_caches\"\n\n\n# entry point  #################################################################\n\
          def main(caches: dict):\n    if PROMPT_KEY_IN_CACHE in caches:\n       \
          \ return {\n            OUTPUT_PROMPT_KEY: caches[PROMPT_KEY_IN_CACHE],\n\
          \            OUTPUT_CACHES_KEY: caches,\n        }\n\n    else:\n      \
          \  # get prompt from API  -------------------------------------------------\n\
          \        # Todo use API\n        presense_prompt = \"\"\"## Kaye Peer Coder\n\
          \n### pre-sense\n\nHere is an improved and clarified version of your prompt:\n\
          \nExtract the following two variables:\n\n- difficulty: Provide a number\
          \ between `0.0` (very easy) and `1.0` (very hard) that represents the assumed\
          \ difficulty of the user's proposed task. You may use as many decimal places\
          \ as necessary for appropriate precision.\n\n- languages: Return a string\
          \ containing the abbreviations of the programming languages (as defined\
          \ below) required by the user, separated by commas. For example, `'py,cpp'`.\
          \ If the conversation does not mention any specific programming language,\
          \ such as when discussing conceptual or general algorithms, return an empty\
          \ string (`''`).\n\n## Programming Languages\n\n(`abbr`: explanation & alternative\
          \ names)\n\n- `c`: **C**\n- `cpp`: **C++**, cpp, or cxx\n\n  - `ue`: **Unreal**\
          \ Engine code using C++\n\n- `csharp`: **C#**, or cs\n\n  - `u3d`: **Unity**\
          \ Engine code using C#\n\n- `console`: any types of terminal console\n-\
          \ `css`: CSS\n- `html`: HTML\n- `js`: JavaScript\n- `ts`: TypeScript\n-\
          \ `py`: Python\n\"\"\"\n\n        # update Conversation Variable caches\n\
          \        caches[PROMPT_KEY_IN_CACHE] = presense_prompt\n        return {\n\
          \            OUTPUT_PROMPT_KEY: presense_prompt,\n            OUTPUT_CACHES_KEY:\
          \ caches,\n        }\n\n"
        code_language: python3
        desc: ''
